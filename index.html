<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPX → KML</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Convert GPX files to KML in your browser. Works with Insta360 and other GPS tracks."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main class="shell">
      <header class="hero">
        <p class="brand">GPX → KML</p>
        <h1>Convert your GPS track to KML</h1>
        <p class="lede">
          Drop a <code>.gpx</code> file (Insta360, Garmin, and more). Conversion
          runs entirely in your browser; nothing is uploaded to a server.
        </p>
      </header>

      <section
        class="dropzone"
        id="dropzone"
        tabindex="0"
        role="button"
        aria-label="Select or drop a GPX file"
      >
        <input
          type="file"
          id="fileInput"
          accept=".gpx,application/gpx+xml,text/xml,application/xml"
          hidden
        />
        <p class="drop-title">Drop your GPX here</p>
        <p class="drop-hint">or click to choose a file</p>
      </section>

      <section class="status" id="status" hidden>
        <p id="statusText"></p>
        <button type="button" class="btn" id="downloadBtn" hidden>
          Download KML
        </button>
      </section>

      <div
        id="map"
        class="map"
        hidden
        role="region"
        aria-label="Track map preview"
      ></div>

      <p class="error" id="error" hidden></p>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
